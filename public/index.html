<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Переход в закрытый канал</title>
  <meta name="description" content="Психология себя и людей: закрытые разборы, которые не пропускает TikTok.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <style>
    :root {
      --bg-color: #0b0e14;
      --card-bg: rgba(22, 27, 34, 0.95);
      --card-border: rgba(148, 163, 184, 0.22);
      --tg-blue: #229ed9;
      --tg-blue-light: #2aabee;
      --tg-pulse: rgba(34, 158, 217, 0.42);
      --success-green: #16a34a;
      --text-main: #f8fafc;
      --text-muted: #cbd5e1;
      --accent-sky: #38bdf8;
      --emerald-soft: #6ee7b7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    html, body {
      height: 100%;
    }

    body {
      background: radial-gradient(circle at 50% 30%, #111827 0%, var(--bg-color) 68%);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 20px;
      overflow: hidden;
      position: relative;
    }

    .wrapper {
      width: 100%;
      max-width: 344px;
      position: relative;
      z-index: 10;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 26px;
      padding: 32px 24px 26px;
      width: 100%;
      text-align: center;
      box-shadow: 0 24px 54px rgba(0, 0, 0, 0.58), 0 0 36px rgba(34, 158, 217, 0.08);
      animation: fadeIn 0.35s ease-out;
      transition: opacity 0.28s ease, transform 0.28s ease, filter 0.28s ease;
    }

    body.spotlight-active .card {
      opacity: 0.25;
      transform: scale(0.98);
      pointer-events: none;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .tg-orb {
      width: 68px;
      height: 68px;
      border-radius: 999px;
      margin: 0 auto 16px;
      background: rgba(34, 158, 217, 0.14);
      border: 1px solid rgba(56, 189, 248, 0.42);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 36px rgba(34, 158, 217, 0.36);
      animation: orbPulse 2.6s ease-in-out infinite;
    }

    @keyframes orbPulse {
      0%, 100% { box-shadow: 0 0 28px rgba(34, 158, 217, 0.3); transform: scale(1); }
      50% { box-shadow: 0 0 42px rgba(34, 158, 217, 0.52); transform: scale(1.03); }
    }

    .tg-orb svg {
      width: 32px;
      height: 32px;
      fill: var(--accent-sky);
      transform: translateX(-1px);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 5px 12px;
      border-radius: 999px;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(52, 211, 153, 0.32);
      color: var(--emerald-soft);
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 14px;
      transition: all 0.2s ease;
    }

    .badge.redirecting {
      background: rgba(56, 189, 248, 0.14);
      border-color: rgba(56, 189, 248, 0.42);
      color: #bae6fd;
    }

    .badge-dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: #34d399;
      box-shadow: 0 0 8px #34d399;
      animation: blink 1.6s infinite;
      flex-shrink: 0;
    }

    .badge.redirecting .badge-dot {
      background: var(--accent-sky);
      box-shadow: 0 0 8px var(--accent-sky);
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    h1 {
      font-size: 24px;
      font-weight: 800;
      line-height: 1.2;
      letter-spacing: -0.02em;
      color: #ffffff;
      margin-bottom: 10px;
    }

    .desc {
      font-size: 14.5px;
      line-height: 1.45;
      color: var(--text-muted);
      margin-bottom: 24px;
      padding: 0 4px;
    }

    .buttons-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }

    .cta-btn {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      width: 100%;
      padding: 15px 18px;
      background: linear-gradient(135deg, var(--tg-blue-light) 0%, var(--tg-blue) 100%);
      color: #ffffff;
      text-decoration: none;
      font-size: 16px;
      font-weight: 700;
      border-radius: 16px;
      box-shadow: 0 10px 28px var(--tg-pulse);
      border: none;
      cursor: pointer;
      transition: transform 0.16s ease, box-shadow 0.2s ease, background 0.2s ease;
      animation: pulseBtn 2.2s infinite ease-in-out;
    }

    @keyframes pulseBtn {
      0%, 100% { box-shadow: 0 8px 24px rgba(34, 158, 217, 0.38); transform: scale(1); }
      50% { box-shadow: 0 12px 32px rgba(34, 158, 217, 0.62); transform: scale(1.018); }
    }

    .cta-btn:active {
      transform: scale(0.97) !important;
    }

    .cta-btn.cta-copied {
      background: var(--success-green);
      box-shadow: none;
      animation: none;
    }

    .cta-btn svg {
      width: 20px;
      height: 20px;
      fill: #ffffff;
      flex-shrink: 0;
    }

    .copy-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 11px 14px;
      background: rgba(30, 41, 59, 0.72);
      border: 1px solid rgba(148, 163, 184, 0.22);
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 500;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .copy-btn:active {
      transform: scale(0.98);
    }

    .copy-btn.copied {
      background: rgba(22, 163, 74, 0.2);
      border-color: rgba(74, 222, 128, 0.55);
      color: var(--emerald-soft);
    }

    .manual-copy-box {
      display: none;
      margin-top: 2px;
      padding: 10px 12px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(56, 189, 248, 0.45);
      border-radius: 12px;
      text-align: left;
    }

    .manual-copy-box.visible {
      display: block;
    }

    .manual-copy-label {
      display: block;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--accent-sky);
      margin-bottom: 6px;
    }

    .manual-copy-box input {
      width: 100%;
      background: rgba(2, 6, 23, 0.85);
      border: 1px solid rgba(148, 163, 184, 0.3);
      border-radius: 8px;
      padding: 8px 10px;
      color: #f8fafc;
      font-size: 12.5px;
      outline: none;
    }

    /* Spotlight Impulse Overlay (Activated inside TikTok / embedded WebView) */
    .spotlight-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 900;
      background: radial-gradient(
        circle at 92% 0%,
        rgba(56, 189, 248, 0.26) 0%,
        rgba(11, 14, 20, 0.68) 42%,
        rgba(4, 6, 10, 0.90) 100%
      );
      pointer-events: auto;
      cursor: pointer;
      animation: backdropFade 0.24s ease-out;
    }

    @keyframes backdropFade {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    body.spotlight-active .spotlight-backdrop {
      display: block;
    }

    .spotlight-popover {
      display: none;
      position: fixed;
      top: 14px;
      right: 12px;
      width: min(306px, calc(100vw - 24px));
      z-index: 1000;
      background: #101928;
      border: 2px solid var(--accent-sky);
      border-radius: 18px;
      padding: 15px 15px 14px;
      box-shadow: 0 18px 46px rgba(14, 165, 233, 0.45), 0 0 0 1px rgba(255, 255, 255, 0.08);
      animation: spotlightPop 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    }

    @keyframes spotlightPop {
      from { opacity: 0; transform: translateY(-8px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    body.spotlight-active .spotlight-popover {
      display: block;
    }

    .sp-close {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 26px;
      height: 26px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.28);
      background: rgba(30, 41, 59, 0.78);
      color: #cbd5e1;
      font-size: 13px;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .sp-close:active {
      transform: scale(0.94);
    }

    .spotlight-caret {
      position: absolute;
      top: -9px;
      right: 16px;
      width: 16px;
      height: 16px;
      background: #101928;
      border-left: 2px solid var(--accent-sky);
      border-top: 2px solid var(--accent-sky);
      transform: rotate(45deg);
    }

    .sp-title {
      font-size: 14.5px;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 10px;
      padding-right: 28px;
      line-height: 1.25;
    }

    .sp-step {
      background: rgba(30, 41, 59, 0.82);
      border: 1px solid rgba(148, 163, 184, 0.24);
      border-radius: 11px;
      padding: 9px 11px;
      font-size: 13.5px;
      color: #e2e8f0;
      margin-bottom: 7px;
      line-height: 1.3;
    }

    .sp-step-active {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: rgba(14, 165, 233, 0.18);
      border-color: rgba(56, 189, 248, 0.55);
      color: #e0f2fe;
    }

    .sp-arrow {
      font-size: 18px;
      font-weight: 800;
      color: var(--accent-sky);
      line-height: 1;
      flex-shrink: 0;
      display: inline-block;
      animation: impulseArrow 1.1s ease-in-out infinite;
    }

    @keyframes impulseArrow {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(2px, -3px) scale(1.14); }
    }

    .sp-footer {
      padding-top: 3px;
      font-size: 13px;
      font-weight: 700;
      color: var(--emerald-soft);
      line-height: 1.3;
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <main class="card">
      <div class="tg-orb" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path d="M21.9 4.6c.3-1.2-.9-2.2-2-1.7L2.6 10.1c-1.1.5-1 2.1.2 2.5l4.4 1.4 1.7 5.3c.3 1 1.6 1.3 2.3.5l2.5-2.6 4.7 3.4c.9.6 2.1.1 2.4-.9l3.1-15.1zm-4.1 3.3l-7.9 7.1-.3 3.2-1.2-3.8 9.4-6.5z"/>
        </svg>
      </div>

      <div id="status-badge" class="badge">
        <span class="badge-dot"></span>
        <span id="badge-text">Закрытый доступ</span>
      </div>

      <h1>Психология себя и людей</h1>
      <p class="desc">Закрытые разборы, которые не пропускает TikTok.</p>

      <div class="buttons-container">
        <a href="https://t.me/+IukZVSEw0io4NGEy" id="action-btn" class="cta-btn">
          <svg id="btn-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21.9 4.6c.3-1.2-.9-2.2-2-1.7L2.6 10.1c-1.1.5-1 2.1.2 2.5l4.4 1.4 1.7 5.3c.3 1 1.6 1.3 2.3.5l2.5-2.6 4.7 3.4c.9.6 2.1.1 2.4-.9l3.1-15.1zm-4.1 3.3l-7.9 7.1-.3 3.2-1.2-3.8 9.4-6.5z"/>
          </svg>
          <span id="btn-text">Открыть в Telegram</span>
        </a>

        <button id="copy-btn" class="copy-btn" type="button">
          <span id="copy-icon">📋</span>
          <span id="copy-text">Скопировать ссылку</span>
        </button>

        <div id="manual-copy-box" class="manual-copy-box">
          <label for="manual-copy-input" class="manual-copy-label">Зажми и нажми «Копировать»:</label>
          <input id="manual-copy-input" type="text" readonly>
        </div>
      </div>
    </main>
  </div>

  <div id="spotlight-backdrop" class="spotlight-backdrop" aria-hidden="true"></div>
  <div id="spotlight-popover" class="spotlight-popover" role="dialog" aria-live="polite" aria-label="Как открыть канал в браузере">
    <div class="spotlight-caret" aria-hidden="true"></div>
    <button type="button" id="sp-close-btn" class="sp-close" aria-label="Закрыть подсказку">✕</button>
    <div class="sp-title">TikTok блокирует прямой вход 🔒</div>
    <div class="sp-step sp-step-active">
      <span>1. Нажми <strong>•••</strong> вот тут</span>
      <span class="sp-arrow">↗</span>
    </div>
    <div id="sp-step-2" class="sp-step">
      2. Выбери <strong>«Открыть в браузере»</strong>
    </div>
    <div class="sp-footer">⚡ Канал откроется сам (за 1 сек)</div>
  </div>

  <script id="tg-config" type="application/json">{"url":"https://t.me/+IukZVSEw0io4NGEy","deeplink":"tg://join?invite=IukZVSEw0io4NGEy","version":1,"android_intent_mode":"off"}</script>
  <script>
    (function() {
      const DEFAULT_TG_URL = "https://t.me/+IukZVSEw0io4NGEy";
      const DEFAULT_TG_DEEPLINK = "tg://join?invite=IukZVSEw0io4NGEy";

      let tgCfg = {};
      try {
        const cfgEl = document.getElementById("tg-config");
        if (cfgEl && cfgEl.textContent) {
          tgCfg = JSON.parse(cfgEl.textContent) || {};
        }
      } catch (e) {}

      const TG_URL = (typeof tgCfg.url === "string" && tgCfg.url.trim()) ? tgCfg.url.trim() : DEFAULT_TG_URL;
      const TG_DEEPLINK = (typeof tgCfg.deeplink === "string" && tgCfg.deeplink.trim()) ? tgCfg.deeplink.trim() : DEFAULT_TG_DEEPLINK;
      const CONFIG_VERSION = String(tgCfg.version || 1);
      const ANDROID_INTENT_MODE =
        (typeof tgCfg.android_intent_mode === "string" && ["off", "telegram", "browser"].indexOf(tgCfg.android_intent_mode) !== -1)
          ? tgCfg.android_intent_mode
          : "off";

      const ENDPOINT_TG_APP = "/track-tg-app.json";
      const ENDPOINT_TG_WEB = "/track-tg-web.json";
      const ENDPOINT_TIKTOK_CLICK = "/track-click-tiktok.json";
      const ENDPOINT_COPY = "/track-copy.json";

      const APP_STORAGE_KEY = "tg_app_handoff_ts_v" + CONFIG_VERSION;
      const WEB_STORAGE_KEY = "tg_web_handoff_ts_v" + CONFIG_VERSION;
      const UX_REDIRECT_KEY = "tg_ux_redirect_ts_v" + CONFIG_VERSION;
      const HANDOFF_TTL_MS = 24 * 60 * 60 * 1000;
      const UX_REDIRECT_COOLDOWN_MS = 60 * 1000;
      const AUTO_REDIRECT_DELAY_MS = 100;
      const IOS_FALLBACK_DELAY_MS = 5000;
      const ANDROID_FALLBACK_DELAY_MS = 2200;
      const GENERIC_IOS_WEBVIEW_SPOTLIGHT_MS = 2500;
      const ANDROID_INTENT_FALLBACK_MS = 900;
      const TIKTOK_SPOTLIGHT_AUTO_SHOW_MS = 380;

      const ua = navigator.userAgent || "";
      const isTikTok = /musical_ly|trill|BytedanceWebview|TikTok|ByteLocale/i.test(ua);
      const isBot = /bot|crawl|spider|slurp|facebookexternalhit|facebot|telegrambot|twitterbot|whatsapp|pinterest|peek|preview|google-read-aloud|googleother|oai-searchbot|chatgpt-user|yandex|bytespider|headless|ttauto/i.test(ua);
      const isIOS = /iPhone|iPad|iPod/i.test(ua);
      const isAndroid = /Android/i.test(ua);
      const isGenericIOSWebView =
        isIOS && !isTikTok && !/Safari/i.test(ua) && !/CriOS|FxiOS|EdgiOS|YaBrowser|OPiOS/i.test(ua);

      const statusBadge = document.getElementById("status-badge");
      const badgeText = document.getElementById("badge-text");
      const actionBtn = document.getElementById("action-btn");
      if (actionBtn) {
        actionBtn.setAttribute("href", TG_URL);
      }
      const copyBtn = document.getElementById("copy-btn");
      const copyIcon = document.getElementById("copy-icon");
      const copyText = document.getElementById("copy-text");
      const manualCopyBox = document.getElementById("manual-copy-box");
      const manualCopyInput = document.getElementById("manual-copy-input");
      const spotlightBackdrop = document.getElementById("spotlight-backdrop");
      const spCloseBtn = document.getElementById("sp-close-btn");
      const spStep2 = document.getElementById("sp-step-2");

      let appSentInPage = false;
      let webSentInPage = false;

      function sendBeaconEvent(endpoint, data) {
        try {
          const payload = JSON.stringify(data);
          if (navigator.sendBeacon) {
            const queued = navigator.sendBeacon(endpoint, payload);
            if (queued) return;
          }
          fetch(endpoint, {
            method: "POST",
            mode: "no-cors",
            keepalive: true,
            body: payload
          }).catch(function() {});
        } catch (err) {
          try {
            new Image().src = endpoint + "?t=" + Date.now();
          } catch (e) {}
        }
      }

      function isKeyFresh(storageKey, ttlMs) {
        try {
          const raw = window.localStorage.getItem(storageKey);
          if (!raw) return false;
          const ts = parseInt(raw, 10);
          return !isNaN(ts) && (Date.now() - ts) < (ttlMs !== undefined ? ttlMs : HANDOFF_TTL_MS);
        } catch (e) {
          return false;
        }
      }

      function saveKeyNow(storageKey) {
        try {
          window.localStorage.setItem(storageKey, String(Date.now()));
        } catch (e) {}
      }

      function hasRecentAppHandoff() {
        return appSentInPage || isKeyFresh(APP_STORAGE_KEY, HANDOFF_TTL_MS);
      }

      function hasRecentAnyHandoff() {
        return hasRecentAppHandoff() || webSentInPage || isKeyFresh(WEB_STORAGE_KEY, HANDOFF_TTL_MS);
      }

      function hasRecentUxRedirect() {
        return isKeyFresh(UX_REDIRECT_KEY, UX_REDIRECT_COOLDOWN_MS);
      }

      function markHandoffSent(kind) {
        if (kind === "app") {
          appSentInPage = true;
          saveKeyNow(APP_STORAGE_KEY);
        } else {
          webSentInPage = true;
          saveKeyNow(WEB_STORAGE_KEY);
        }
      }

      function isRestoredNavigation() {
        try {
          if (window.performance && window.performance.getEntriesByType) {
            const entries = window.performance.getEntriesByType("navigation");
            if (entries && entries.length > 0 && entries[0].type === "back_forward") {
              return true;
            }
          }
          if (window.performance && window.performance.navigation && window.performance.navigation.type === 2) {
            return true;
          }
        } catch (e) {}
        return false;
      }

      function legacyExecCopy(text) {
        try {
          const temp = document.createElement("input");
          temp.value = text;
          temp.setAttribute("readonly", "");
          temp.style.position = "fixed";
          temp.style.left = "-9999px";
          document.body.appendChild(temp);
          temp.select();
          temp.setSelectionRange(0, temp.value.length);
          const ok = document.execCommand("copy");
          document.body.removeChild(temp);
          return Boolean(ok);
        } catch (e) {
          return false;
        }
      }

      function copyLinkVerified(onSuccess, onFailure) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(TG_URL).then(function() {
            if (onSuccess) onSuccess();
          }).catch(function() {
            if (legacyExecCopy(TG_URL)) {
              if (onSuccess) onSuccess();
            } else if (onFailure) {
              onFailure();
            }
          });
        } else if (legacyExecCopy(TG_URL)) {
          if (onSuccess) onSuccess();
        } else if (onFailure) {
          onFailure();
        }
      }

      function showManualCopyFallback() {
        if (!manualCopyBox || !manualCopyInput) return;
        manualCopyInput.value = TG_URL;
        manualCopyBox.classList.add("visible");
        try {
          manualCopyInput.focus();
          manualCopyInput.select();
          manualCopyInput.setSelectionRange(0, TG_URL.length);
        } catch (e) {}
      }

      function updateSpotlightBrowserHint() {
        if (!spStep2) return;
        if (isIOS) {
          spStep2.innerHTML = '2. Выбери <strong>«Открыть в браузере»</strong> (Safari 🧭)';
        } else if (isAndroid) {
          spStep2.innerHTML = '2. Выбери <strong>«Открыть в браузере»</strong> (Chrome)';
        } else {
          spStep2.innerHTML = '2. Выбери <strong>«Открыть в браузере»</strong>';
        }
      }

      function openSpotlight() {
        updateSpotlightBrowserHint();
        document.body.classList.add("spotlight-active");
      }

      function closeSpotlight() {
        document.body.classList.remove("spotlight-active");
      }

      if (spotlightBackdrop) {
        spotlightBackdrop.addEventListener("click", closeSpotlight);
      }
      if (spCloseBtn) {
        spCloseBtn.addEventListener("click", closeSpotlight);
      }

      function buildAndroidIntentUrl(mode, tgDeeplink) {
        if (mode === "telegram") {
          const rawTail = String(tgDeeplink || "").replace(/^tg:\/\//i, "");
          return "intent://" + rawTail + "#Intent;scheme=tg;package=org.telegram.messenger;end";
        }
        if (mode === "browser") {
          const targetHostPath = window.location.host + window.location.pathname + window.location.search;
          return "intent://" + targetHostPath + "#Intent;scheme=https;package=com.android.chrome;end";
        }
        return "";
      }

      let lastTikTokTrackTs = 0;
      function canTrackTikTokNow(cooldownMs) {
        const now = Date.now();
        if (now - lastTikTokTrackTs < cooldownMs) return false;
        lastTikTokTrackTs = now;
        return true;
      }

      let handoffActive = false;
      let activeTrigger = "external_browser";
      let fallbackTimer = null;
      let autoStartTimer = null;

      function clearPendingFallback() {
        if (fallbackTimer !== null) {
          clearTimeout(fallbackTimer);
          fallbackTimer = null;
        }
      }

      function clearAutoStart() {
        if (autoStartTimer !== null) {
          clearTimeout(autoStartTimer);
          autoStartTimer = null;
        }
      }

      function emitHandoffBeacon(kind, endpoint, via) {
        if (isBot) return;
        if (kind === "app" ? hasRecentAppHandoff() : hasRecentAnyHandoff()) return;
        markHandoffSent(kind);
        sendBeaconEvent(endpoint, {
          src: activeTrigger || "external_browser",
          via: via,
          ts: Date.now()
        });
      }

      function confirmNativeAppHandoff(reason) {
        if (!handoffActive) return;
        handoffActive = false;
        clearPendingFallback();
        emitHandoffBeacon("app", ENDPOINT_TG_APP, reason);
      }

      document.addEventListener("visibilitychange", function() {
        if (document.visibilityState === "hidden" && handoffActive) {
          confirmNativeAppHandoff("visibility_hidden");
        }
      });

      window.addEventListener("pagehide", function() {
        if (handoffActive) {
          confirmNativeAppHandoff("pagehide");
        }
      });

      window.addEventListener("pageshow", function(e) {
        if (e && e.persisted) {
          handoffActive = false;
          clearPendingFallback();
          clearAutoStart();
        }
      });

      function openTelegramFromBrowser(triggerSource) {
        clearPendingFallback();
        activeTrigger = triggerSource || "external_browser";

        if (isIOS || isAndroid) {
          // Маячок срабатывает только при фактическом уходе браузера в приложение (visibilitychange -> hidden)
          // либо ровно перед web-fallback / Spotlight (для скрытого iOS WKWebView).
          handoffActive = true;
          window.location.href = TG_DEEPLINK;

          if (isGenericIOSWebView) {
            fallbackTimer = setTimeout(function() {
              fallbackTimer = null;
              if (!handoffActive) return;
              if (document.visibilityState === "hidden") {
                confirmNativeAppHandoff("visibility_hidden_timer");
                return;
              }
              handoffActive = false;
              openSpotlight();
            }, GENERIC_IOS_WEBVIEW_SPOTLIGHT_MS);
            return;
          }

          const delayMs = isIOS ? IOS_FALLBACK_DELAY_MS : ANDROID_FALLBACK_DELAY_MS;
          fallbackTimer = setTimeout(function() {
            fallbackTimer = null;
            if (!handoffActive) return;
            if (document.visibilityState === "hidden") {
              confirmNativeAppHandoff("visibility_hidden_timer");
              return;
            }
            // Снимаем флаг до перехода на TG_URL, чтобы pagehide от web-навигации не засчитался как tg-app.
            handoffActive = false;
            emitHandoffBeacon("web", ENDPOINT_TG_WEB, "web_fallback");
            window.location.replace(TG_URL);
          }, delayMs);
        } else {
          handoffActive = false;
          if (document.visibilityState === "visible") {
            emitHandoffBeacon("web", ENDPOINT_TG_WEB, "desktop_redirect");
          }
          window.location.href = TG_URL;
        }
      }

      // Состояние 2: внутри TikTok WebView
      if (isTikTok) {
        updateSpotlightBrowserHint();

        if (!(isAndroid && ANDROID_INTENT_MODE !== "off")) {
          setTimeout(function() {
            openSpotlight();
          }, TIKTOK_SPOTLIGHT_AUTO_SHOW_MS);
        }

        actionBtn.addEventListener("click", function(e) {
          e.preventDefault();
          if (canTrackTikTokNow(3000)) {
            sendBeaconEvent(ENDPOINT_TIKTOK_CLICK, { src: "tiktok_in_app", ts: Date.now() });
          }

          if (isAndroid && ANDROID_INTENT_MODE !== "off") {
            const intentUrl = buildAndroidIntentUrl(ANDROID_INTENT_MODE, TG_DEEPLINK);
            if (intentUrl) {
              clearPendingFallback();
              if (ANDROID_INTENT_MODE === "telegram") {
                activeTrigger = "tiktok_android_intent";
                handoffActive = true;
              } else {
                handoffActive = false;
              }
              window.location.href = intentUrl;
              fallbackTimer = setTimeout(function() {
                fallbackTimer = null;
                if (document.visibilityState === "hidden") {
                  if (handoffActive) {
                    confirmNativeAppHandoff("android_intent_timer");
                  }
                  return;
                }
                handoffActive = false;
                openSpotlight();
              }, ANDROID_INTENT_FALLBACK_MS);
              return;
            }
          }

          openSpotlight();
        });
      } else {
        function scheduleAutoRedirect() {
          if (isBot || isRestoredNavigation() || hasRecentUxRedirect()) {
            return;
          }
          if (statusBadge) statusBadge.classList.add("redirecting");
          if (badgeText) badgeText.textContent = "⚡ Перенаправляем в Telegram...";
          clearAutoStart();
          autoStartTimer = setTimeout(function() {
            autoStartTimer = null;
            if (document.visibilityState !== "visible") return;
            saveKeyNow(UX_REDIRECT_KEY);
            openTelegramFromBrowser("external_browser");
          }, AUTO_REDIRECT_DELAY_MS);
        }

        // Состояние 3: внешний браузер (Safari / Chrome) — авто-редирект только для активной новой вкладки
        if (!isBot && !isRestoredNavigation() && !hasRecentUxRedirect()) {
          if (document.visibilityState === "visible") {
            scheduleAutoRedirect();
          } else {
            const onFirstVisible = function() {
              if (document.visibilityState === "visible") {
                document.removeEventListener("visibilitychange", onFirstVisible);
                scheduleAutoRedirect();
              }
            };
            document.addEventListener("visibilitychange", onFirstVisible);
          }
        }

        actionBtn.addEventListener("click", function(e) {
          e.preventDefault();
          clearAutoStart();
          saveKeyNow(UX_REDIRECT_KEY);
          openTelegramFromBrowser("manual_cta");
        });
      }

      // Вторичная кнопка ручного копирования ссылки (отдельный эндпоинт, не влияет на счётчик TG)
      let copyResetTimer = null;
      copyBtn.addEventListener("click", function() {
        const now = Date.now();
        let lastCopy = 0;
        try {
          lastCopy = parseInt(sessionStorage.getItem("last_copy_click") || "0", 10) || 0;
          if (now - lastCopy < 1500) return;
          sessionStorage.setItem("last_copy_click", String(now));
        } catch (e) {}

        sendBeaconEvent(ENDPOINT_COPY, { src: "copy_link", ts: now });
        copyLinkVerified(
          function() {
            if (manualCopyBox) manualCopyBox.classList.remove("visible");
            copyBtn.classList.add("copied");
            copyIcon.textContent = "✓";
            copyText.textContent = "Ссылка скопирована!";
            if (copyResetTimer) clearTimeout(copyResetTimer);
            copyResetTimer = setTimeout(function() {
              copyBtn.classList.remove("copied");
              copyIcon.textContent = "📋";
              copyText.textContent = "Скопировать ссылку";
            }, 3000);
          },
          function() {
            showManualCopyFallback();
          }
        );
      });
    })();
  </script>
</body>
</html>
