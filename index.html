<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Переход в закрытый канал</title>
  <meta name="description" content="Психология себя и людей: закрытые разборы, которые не пропускает TikTok.">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <style>
    :root {
      --bg-color: #0b0e14;
      --card-bg: rgba(22, 27, 34, 0.95);
      --card-border: rgba(148, 163, 184, 0.22);
      --tg-blue: #229ed9;
      --tg-blue-light: #2aabee;
      --tg-pulse: rgba(34, 158, 217, 0.42);
      --success-green: #16a34a;
      --text-main: #f8fafc;
      --text-muted: #cbd5e1;
      --accent-sky: #38bdf8;
      --emerald-soft: #6ee7b7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    html, body {
      height: 100%;
    }

    body {
      background: radial-gradient(circle at 50% 30%, #111827 0%, var(--bg-color) 68%);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 20px;
      overflow: hidden;
      position: relative;
    }

    .wrapper {
      width: 100%;
      max-width: 344px;
      position: relative;
      z-index: 10;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 26px;
      padding: 32px 24px 26px;
      width: 100%;
      text-align: center;
      box-shadow: 0 24px 54px rgba(0, 0, 0, 0.58), 0 0 36px rgba(34, 158, 217, 0.08);
      animation: fadeIn 0.35s ease-out;
      transition: opacity 0.28s ease, transform 0.28s ease, filter 0.28s ease;
    }

    body.spotlight-active .card {
      opacity: 0.25;
      transform: scale(0.98);
      pointer-events: none;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .tg-orb {
      width: 68px;
      height: 68px;
      border-radius: 999px;
      margin: 0 auto 16px;
      background: rgba(34, 158, 217, 0.14);
      border: 1px solid rgba(56, 189, 248, 0.42);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 36px rgba(34, 158, 217, 0.36);
      animation: orbPulse 2.6s ease-in-out infinite;
    }

    @keyframes orbPulse {
      0%, 100% { box-shadow: 0 0 28px rgba(34, 158, 217, 0.3); transform: scale(1); }
      50% { box-shadow: 0 0 42px rgba(34, 158, 217, 0.52); transform: scale(1.03); }
    }

    .tg-orb svg {
      width: 32px;
      height: 32px;
      fill: var(--accent-sky);
      transform: translateX(-1px);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 5px 12px;
      border-radius: 999px;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(52, 211, 153, 0.32);
      color: var(--emerald-soft);
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 14px;
      transition: all 0.2s ease;
    }

    .badge.redirecting {
      background: rgba(56, 189, 248, 0.14);
      border-color: rgba(56, 189, 248, 0.42);
      color: #bae6fd;
    }

    .badge-dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: #34d399;
      box-shadow: 0 0 8px #34d399;
      animation: blink 1.6s infinite;
      flex-shrink: 0;
    }

    .badge.redirecting .badge-dot {
      background: var(--accent-sky);
      box-shadow: 0 0 8px var(--accent-sky);
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }

    h1 {
      font-size: 24px;
      font-weight: 800;
      line-height: 1.2;
      letter-spacing: -0.02em;
      color: #ffffff;
      margin-bottom: 10px;
    }

    .desc {
      font-size: 14.5px;
      line-height: 1.45;
      color: var(--text-muted);
      margin-bottom: 24px;
      padding: 0 4px;
    }

    .buttons-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }

    .cta-btn {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      width: 100%;
      padding: 15px 18px;
      background: linear-gradient(135deg, var(--tg-blue-light) 0%, var(--tg-blue) 100%);
      color: #ffffff;
      text-decoration: none;
      font-size: 16px;
      font-weight: 700;
      border-radius: 16px;
      box-shadow: 0 10px 28px var(--tg-pulse);
      border: none;
      cursor: pointer;
      transition: transform 0.16s ease, box-shadow 0.2s ease, background 0.2s ease;
      animation: pulseBtn 2.2s infinite ease-in-out;
    }

    @keyframes pulseBtn {
      0%, 100% { box-shadow: 0 8px 24px rgba(34, 158, 217, 0.38); transform: scale(1); }
      50% { box-shadow: 0 12px 32px rgba(34, 158, 217, 0.62); transform: scale(1.018); }
    }

    .cta-btn:active {
      transform: scale(0.97) !important;
    }

    .cta-btn.cta-copied {
      background: var(--success-green);
      box-shadow: none;
      animation: none;
    }

    .cta-btn svg {
      width: 20px;
      height: 20px;
      fill: #ffffff;
      flex-shrink: 0;
    }

    .copy-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 11px 14px;
      background: rgba(30, 41, 59, 0.72);
      border: 1px solid rgba(148, 163, 184, 0.22);
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 500;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .copy-btn:active {
      transform: scale(0.98);
    }

    .copy-btn.copied {
      background: rgba(22, 163, 74, 0.2);
      border-color: rgba(74, 222, 128, 0.55);
      color: var(--emerald-soft);
    }

    /* Spotlight Impulse Overlay (Activated inside TikTok WebView on CTA tap) */
    .spotlight-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 900;
      background: radial-gradient(
        circle at 92% 0%,
        rgba(56, 189, 248, 0.26) 0%,
        rgba(11, 14, 20, 0.68) 42%,
        rgba(4, 6, 10, 0.90) 100%
      );
      pointer-events: none;
      animation: backdropFade 0.24s ease-out;
    }

    @keyframes backdropFade {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    body.spotlight-active .spotlight-backdrop {
      display: block;
    }

    .spotlight-popover {
      display: none;
      position: fixed;
      top: 14px;
      right: 12px;
      width: min(306px, calc(100vw - 24px));
      z-index: 1000;
      background: #101928;
      border: 2px solid var(--accent-sky);
      border-radius: 18px;
      padding: 15px 15px 14px;
      box-shadow: 0 18px 46px rgba(14, 165, 233, 0.45), 0 0 0 1px rgba(255, 255, 255, 0.08);
      animation: spotlightPop 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    }

    @keyframes spotlightPop {
      from { opacity: 0; transform: translateY(-8px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    body.spotlight-active .spotlight-popover {
      display: block;
    }

    .spotlight-caret {
      position: absolute;
      top: -9px;
      right: 16px;
      width: 16px;
      height: 16px;
      background: #101928;
      border-left: 2px solid var(--accent-sky);
      border-top: 2px solid var(--accent-sky);
      transform: rotate(45deg);
    }

    .sp-title {
      font-size: 14.5px;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 10px;
      line-height: 1.25;
    }

    .sp-step {
      background: rgba(30, 41, 59, 0.82);
      border: 1px solid rgba(148, 163, 184, 0.24);
      border-radius: 11px;
      padding: 9px 11px;
      font-size: 13.5px;
      color: #e2e8f0;
      margin-bottom: 7px;
      line-height: 1.3;
    }

    .sp-step-active {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: rgba(14, 165, 233, 0.18);
      border-color: rgba(56, 189, 248, 0.55);
      color: #e0f2fe;
    }

    .sp-arrow {
      font-size: 18px;
      font-weight: 800;
      color: var(--accent-sky);
      line-height: 1;
      flex-shrink: 0;
      display: inline-block;
      animation: impulseArrow 1.1s ease-in-out infinite;
    }

    @keyframes impulseArrow {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(2px, -3px) scale(1.14); }
    }

    .sp-footer {
      padding-top: 3px;
      font-size: 13px;
      font-weight: 700;
      color: var(--emerald-soft);
      line-height: 1.3;
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <main class="card">
      <div class="tg-orb" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path d="M21.9 4.6c.3-1.2-.9-2.2-2-1.7L2.6 10.1c-1.1.5-1 2.1.2 2.5l4.4 1.4 1.7 5.3c.3 1 1.6 1.3 2.3.5l2.5-2.6 4.7 3.4c.9.6 2.1.1 2.4-.9l3.1-15.1zm-4.1 3.3l-7.9 7.1-.3 3.2-1.2-3.8 9.4-6.5z"/>
        </svg>
      </div>

      <div id="status-badge" class="badge">
        <span class="badge-dot"></span>
        <span id="badge-text">Закрытый доступ</span>
      </div>

      <h1>Психология себя и людей</h1>
      <p class="desc">Закрытые разборы, которые не пропускает TikTok.</p>

      <div class="buttons-container">
        <a href="https://t.me/+IukZVSEw0io4NGEy" id="action-btn" class="cta-btn">
          <svg id="btn-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21.9 4.6c.3-1.2-.9-2.2-2-1.7L2.6 10.1c-1.1.5-1 2.1.2 2.5l4.4 1.4 1.7 5.3c.3 1 1.6 1.3 2.3.5l2.5-2.6 4.7 3.4c.9.6 2.1.1 2.4-.9l3.1-15.1zm-4.1 3.3l-7.9 7.1-.3 3.2-1.2-3.8 9.4-6.5z"/>
          </svg>
          <span id="btn-text">Открыть в Telegram</span>
        </a>

        <button id="copy-btn" class="copy-btn" type="button">
          <span id="copy-icon">📋</span>
          <span id="copy-text">Скопировать ссылку</span>
        </button>
      </div>
    </main>
  </div>

  <div class="spotlight-backdrop" aria-hidden="true"></div>
  <div id="spotlight-popover" class="spotlight-popover" role="dialog" aria-live="polite" aria-label="Как открыть канал в браузере">
    <div class="spotlight-caret" aria-hidden="true"></div>
    <div class="sp-title">TikTok блокирует прямой вход 🔒</div>
    <div class="sp-step sp-step-active">
      <span>1. Нажми <strong>•••</strong> вот тут</span>
      <span class="sp-arrow">↗</span>
    </div>
    <div class="sp-step">
      2. Выбери <strong>«Открыть в браузере»</strong>
    </div>
    <div class="sp-footer">⚡ Канал откроется сам (за 1 сек)</div>
  </div>

  <script>
    (function() {
      const INVITE_HASH = "IukZVSEw0io4NGEy";
      const TG_URL = "https://t.me/+" + INVITE_HASH;
      const TG_DEEPLINK = "tg://join?invite=" + INVITE_HASH;

      const ENDPOINT_TG_APP = "/track-tg-app.json";
      const ENDPOINT_TG_WEB = "/track-tg-web.json";
      const ENDPOINT_TIKTOK_CLICK = "/track-click-tiktok.json";
      const ENDPOINT_COPY = "/track-copy.json";

      const APP_STORAGE_KEY = "tg_app_handoff_ts_v1";
      const WEB_STORAGE_KEY = "tg_web_handoff_ts_v1";
      const HANDOFF_TTL_MS = 24 * 60 * 60 * 1000;
      const AUTO_REDIRECT_DELAY_MS = 100;
      const FALLBACK_DELAY_MS = 2300;

      const ua = navigator.userAgent || "";
      const isTikTok = /musical_ly|trill|BytedanceWebview|TikTok|ByteLocale/i.test(ua);
      const isBot = /bot|crawl|spider|slurp|facebookexternalhit|telegrambot|twitterbot|whatsapp|pinterest|peek|preview/i.test(ua);
      const isIOS = /iPhone|iPad|iPod/i.test(ua);
      const isAndroid = /Android/i.test(ua);

      const statusBadge = document.getElementById("status-badge");
      const badgeText = document.getElementById("badge-text");
      const actionBtn = document.getElementById("action-btn");
      const btnIcon = document.getElementById("btn-icon");
      const btnText = document.getElementById("btn-text");
      const copyBtn = document.getElementById("copy-btn");
      const copyIcon = document.getElementById("copy-icon");
      const copyText = document.getElementById("copy-text");

      let appSentInPage = false;
      let webSentInPage = false;

      function sendBeaconEvent(endpoint, data) {
        try {
          const payload = JSON.stringify(data);
          if (navigator.sendBeacon) {
            const queued = navigator.sendBeacon(endpoint, payload);
            if (queued) return;
          }
          fetch(endpoint, {
            method: "POST",
            mode: "no-cors",
            keepalive: true,
            body: payload
          }).catch(function() {});
        } catch (err) {
          try {
            new Image().src = endpoint + "?t=" + Date.now();
          } catch (e) {}
        }
      }

      function isKeyFresh(storageKey) {
        try {
          const raw = window.localStorage.getItem(storageKey);
          if (!raw) return false;
          const ts = parseInt(raw, 10);
          return !isNaN(ts) && (Date.now() - ts) < HANDOFF_TTL_MS;
        } catch (e) {
          return false;
        }
      }

      function saveKeyNow(storageKey) {
        try {
          window.localStorage.setItem(storageKey, String(Date.now()));
        } catch (e) {}
      }

      function hasRecentAppHandoff() {
        return appSentInPage || isKeyFresh(APP_STORAGE_KEY);
      }

      function hasRecentAnyHandoff() {
        return hasRecentAppHandoff() || webSentInPage || isKeyFresh(WEB_STORAGE_KEY);
      }

      function markHandoffSent(kind) {
        if (kind === "app") {
          appSentInPage = true;
          saveKeyNow(APP_STORAGE_KEY);
        } else {
          webSentInPage = true;
          saveKeyNow(WEB_STORAGE_KEY);
        }
      }

      function isRestoredNavigation() {
        try {
          if (window.performance && window.performance.getEntriesByType) {
            const entries = window.performance.getEntriesByType("navigation");
            if (entries && entries.length > 0 && entries[0].type === "back_forward") {
              return true;
            }
          }
          if (window.performance && window.performance.navigation && window.performance.navigation.type === 2) {
            return true;
          }
        } catch (e) {}
        return false;
      }

      function legacyExecCopy(text) {
        try {
          const temp = document.createElement("input");
          temp.value = text;
          temp.setAttribute("readonly", "");
          temp.style.position = "fixed";
          temp.style.left = "-9999px";
          document.body.appendChild(temp);
          temp.select();
          temp.setSelectionRange(0, temp.value.length);
          const ok = document.execCommand("copy");
          document.body.removeChild(temp);
          return ok;
        } catch (e) {
          return false;
        }
      }

      function silentCopyLink(onDone) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(TG_URL).then(function() {
            if (onDone) onDone();
          }).catch(function() {
            legacyExecCopy(TG_URL);
            if (onDone) onDone();
          });
        } else {
          legacyExecCopy(TG_URL);
          if (onDone) onDone();
        }
      }

      let lastTikTokTrackTs = 0;
      function canTrackTikTokNow(cooldownMs) {
        const now = Date.now();
        if (now - lastTikTokTrackTs < cooldownMs) return false;
        lastTikTokTrackTs = now;
        return true;
      }

      function showActionCopiedState() {
        actionBtn.classList.add("cta-copied");
        if (btnIcon) btnIcon.style.display = "none";
        btnText.textContent = "✓ Ссылка скопирована";
      }

      let handoffActive = false;
      let activeTrigger = "external_browser";
      let fallbackTimer = null;
      let autoStartTimer = null;

      function clearPendingFallback() {
        if (fallbackTimer !== null) {
          clearTimeout(fallbackTimer);
          fallbackTimer = null;
        }
      }

      function clearAutoStart() {
        if (autoStartTimer !== null) {
          clearTimeout(autoStartTimer);
          autoStartTimer = null;
        }
      }

      function emitHandoffBeacon(kind, endpoint, via) {
        if (isBot) return;
        if (kind === "app" ? hasRecentAppHandoff() : hasRecentAnyHandoff()) return;
        markHandoffSent(kind);
        sendBeaconEvent(endpoint, {
          src: activeTrigger || "external_browser",
          via: via,
          ts: Date.now()
        });
      }

      function confirmNativeAppHandoff(reason) {
        if (!handoffActive) return;
        handoffActive = false;
        clearPendingFallback();
        emitHandoffBeacon("app", ENDPOINT_TG_APP, reason);
      }

      function openTelegramFromBrowser(triggerSource) {
        clearPendingFallback();
        activeTrigger = triggerSource || "external_browser";

        if (isIOS || isAndroid) {
          // Маячок срабатывает только при фактическом уходе браузера в приложение (visibilitychange -> hidden)
          // либо ровно перед web-fallback, если tg:// не перехватило приложение за FALLBACK_DELAY_MS.
          handoffActive = true;
          window.location.href = TG_DEEPLINK;

          fallbackTimer = setTimeout(function() {
            fallbackTimer = null;
            if (!handoffActive) return;
            if (document.visibilityState === "hidden") {
              confirmNativeAppHandoff("visibility_hidden_timer");
              return;
            }
            // Снимаем флаг до перехода на TG_URL, чтобы pagehide от web-навигации не засчитался как tg-app.
            handoffActive = false;
            emitHandoffBeacon("web", ENDPOINT_TG_WEB, "web_fallback");
            window.location.replace(TG_URL);
          }, FALLBACK_DELAY_MS);
        } else {
          handoffActive = false;
          if (document.visibilityState === "visible") {
            emitHandoffBeacon("web", ENDPOINT_TG_WEB, "desktop_redirect");
          }
          window.location.href = TG_URL;
        }
      }

      // Состояние 2: внутри TikTok WebView перехватываем клик и включаем Spotlight-импульс
      if (isTikTok) {
        actionBtn.addEventListener("click", function(e) {
          e.preventDefault();
          if (canTrackTikTokNow(3000)) {
            sendBeaconEvent(ENDPOINT_TIKTOK_CLICK, { src: "tiktok_in_app", ts: Date.now() });
          }
          showActionCopiedState();
          document.body.classList.add("spotlight-active");
          silentCopyLink();
        });
      } else {
        // Слушаем фактический переход браузера в фон (открытие приложения Telegram)
        document.addEventListener("visibilitychange", function() {
          if (document.visibilityState === "hidden" && handoffActive) {
            confirmNativeAppHandoff("visibility_hidden");
          }
        });

        window.addEventListener("pagehide", function() {
          if (handoffActive) {
            confirmNativeAppHandoff("pagehide");
          }
        });

        // При восстановлении вкладки из bfcache отменяем любые отложенные авто-действия
        window.addEventListener("pageshow", function(e) {
          if (e && e.persisted) {
            handoffActive = false;
            clearPendingFallback();
            clearAutoStart();
          }
        });

        function scheduleAutoRedirect() {
          if (isBot || isRestoredNavigation() || hasRecentAnyHandoff()) {
            return;
          }
          if (statusBadge) statusBadge.classList.add("redirecting");
          if (badgeText) badgeText.textContent = "⚡ Перенаправляем в Telegram...";
          clearAutoStart();
          autoStartTimer = setTimeout(function() {
            autoStartTimer = null;
            if (document.visibilityState !== "visible") return;
            openTelegramFromBrowser("external_browser");
          }, AUTO_REDIRECT_DELAY_MS);
        }

        // Состояние 3: внешний браузер (Safari / Chrome) — авто-редирект только для активной новой вкладки
        if (!isBot && !isRestoredNavigation() && !hasRecentAnyHandoff()) {
          if (document.visibilityState === "visible") {
            scheduleAutoRedirect();
          } else {
            const onFirstVisible = function() {
              if (document.visibilityState === "visible") {
                document.removeEventListener("visibilitychange", onFirstVisible);
                scheduleAutoRedirect();
              }
            };
            document.addEventListener("visibilitychange", onFirstVisible);
          }
        }

        actionBtn.addEventListener("click", function(e) {
          e.preventDefault();
          clearAutoStart();
          openTelegramFromBrowser("manual_cta");
        });
      }

      // Вторичная кнопка ручного копирования ссылки (отдельный эндпоинт, не влияет на счётчик TG)
      let copyResetTimer = null;
      copyBtn.addEventListener("click", function() {
        const now = Date.now();
        let lastCopy = 0;
        try {
          lastCopy = parseInt(sessionStorage.getItem("last_copy_click") || "0", 10) || 0;
          if (now - lastCopy < 1500) return;
          sessionStorage.setItem("last_copy_click", String(now));
        } catch (e) {}

        sendBeaconEvent(ENDPOINT_COPY, { src: "copy_link", ts: now });
        silentCopyLink(function() {
          copyBtn.classList.add("copied");
          copyIcon.textContent = "✓";
          copyText.textContent = "Ссылка скопирована!";
          if (copyResetTimer) clearTimeout(copyResetTimer);
          copyResetTimer = setTimeout(function() {
            copyBtn.classList.remove("copied");
            copyIcon.textContent = "📋";
            copyText.textContent = "Скопировать ссылку";
          }, 3000);
        });
      });
    })();
  </script>
</body>
</html>
